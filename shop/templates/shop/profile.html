
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль — Bazarix</title>
    <link rel="stylesheet" href="{% static 'shop/css/style.css' %}">

    <style>
        .profile-page {
            min-height: 100vh;
            background: #f8f7f1;
            padding: 50px 20px;
        }

        .profile-container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,.05);
        }

        .profile-title {
            color: #174d38;
            margin-bottom: 30px;
        }

        .profile-photo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            background: #eee;
            display: block;
            margin: 0 auto 15px;
        }

        .photo-label {
            display: block;
            text-align: center;
            color: #26734d;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .profile-field {
            margin-bottom: 20px;
        }

        .profile-field label {
            display: block;
            margin-bottom: 8px;
            color: #174d38;
            font-weight: 600;
        }

        .profile-field input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .profile-save {
            width: 100%;
            padding: 15px;
            background: #174d38;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        .profile-back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #174d38;
            text-decoration: none;
        }

        .profile-message {
            color: #26734d;
            margin-bottom: 15px;
        }

        @media(max-width: 600px) {
            .profile-container {
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

<div class="profile-page">
    <div class="profile-container">

        <h1 class="profile-title">Мой профиль</h1>

        {% if messages %}
            {% for message in messages %}
                <p class="profile-message">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {% if profile.photo %}
                <img src="{{ profile.photo.url }}"
                     class="profile-photo" id="photoPreview"
                     alt="Фото профиля">
            {% else %}
                <img src="https://placehold.co/130x130/e9eee9/174d38?text=Photo"
                     class="profile-photo" id="photoPreview"
                     alt="Фото профиля">
            {% endif %}

            <label for="photo" class="photo-label">
                ✎ Изменить фотографию
            </label>

            <input type="file" name="photo" id="photo"
                   accept="image/*" hidden>

            <div class="profile-field">
                <label>Имя</label>
                <input type="text" name="first_name"
                       value="{{ request.user.first_name }}"
                       placeholder="Ваше имя">
            </div>

            <div class="profile-field">
                <label>Фамилия</label>
                <input type="text" name="last_name"
                       value="{{ request.user.last_name }}"
                       placeholder="Ваша фамилия">
            </div>

            <div class="profile-field">
                <label>Email</label>
                <input type="email" name="email"
                       value="{{ request.user.email }}"
                       placeholder="Ваш Email" required>
            </div>

            <button type="submit" class="profile-save">
                Сохранить изменения
            </button>
        </form>

        <a href="{% url 'home' %}" class="profile-back">
            ← Вернуться в магазин
        </a>

    </div>
</div>

<script>
document.getElementById('photo').addEventListener('change', function(event) {
    const file = event.target.files[0];

    if (file) {
        document.getElementById('photoPreview').src =
            URL.createObjectURL(file);
    }
});
</script>

</body>
</html>
